<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header class="header">
      <h1>Tetris</h1>
    </header>

    <div class="layout">
      <canvas id="board" width="300" height="600" aria-label="Tetris board"></canvas>

      <aside class="panel">
        <div class="stat">
          <span class="label">Score</span>
          <span id="score" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">High Score</span>
          <span id="high-score" class="value">0</span>
        </div>
        <div class="stat">
          <span class="label">Level</span>
          <span id="level" class="value">1</span>
        </div>
        <div class="stat">
          <span class="label">Lines</span>
          <span id="lines" class="value">0</span>
        </div>

        <div class="next">
          <span class="label">Next</span>
          <canvas id="next" width="120" height="120" aria-label="Next piece"></canvas>
        </div>

        <div class="controls">
          <p><kbd>←</kbd> <kbd>→</kbd> Move</p>
          <p><kbd>↑</kbd> Rotate</p>
          <p><kbd>↓</kbd> Soft drop</p>
          <p><kbd>Space</kbd> Hard drop</p>
          <p><kbd>P</kbd> Pause</p>
        </div>

        <button id="start-btn" type="button">Start</button>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <p id="overlay-text">Paused</p>
      <button id="overlay-btn" type="button">Resume</button>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
